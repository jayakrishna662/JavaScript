<html>
    <head>
        <h2>RegistrationForm</h2>
    </head>
    <body>
        <form id="RegistrationForm">
            <label for="UserName">Name</label> <!--benefit of for attribute: when you click on label Name , cursor moves to the respective box-->
            <input type="text" id="UserName" minlength="6" required> <!-- here id should match above for value--> <br><br>

            <label for="pass">Password</label>
            <input type="password" minlength="6" maxlength="15" id="pass" required><br><br>

            <label for="mail">Email</label>
            <input type="email" id="mail" placeholder="alice@gmail.com"><br><br>

            <label for="mobile">Phone no</label>
            <input type="tel" id="mobile" pattern="[0-9]{10}"><br><br>

            <label for="BOD">DateOFBirth</label>
            <input type="date" id="BOD" > <br><br>

            <label for="Gender">Gender: </label>
            <label for="Male">Male</label>
            <input type="radio" id="Male" value="Male" name="Gender">
            <label for="Female">Female</label>
            <input type="radio" id="Female" value="Female" name="Gender"> <br><br>

            <input type="reset"><br><br> 
            <input type="submit">
        </form>
        </div>
        <script src="index.js"></script>  <!-- After loading this HTML,also load and execute index.js" -->
    </body>
</html>
